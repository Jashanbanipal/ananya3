<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Babe Dino Runner</title>
    <style>
      :root {
        --bg: #fff5f7;
        --card: #fffafc;
        --ground: #514d5d;
        --dino: #1d1d1d;
        --pink: #ff6fae;
        --rose: #ff4d8d;
        --gold: #ffcf5a;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #ffeaf2, #fff7d9, #f6e8ff);
        font-family: Arial, sans-serif;
      }

      .game-wrap {
        width: min(92vw, 900px);
        background: var(--card);
        border: 4px solid #f7c8d8;
        border-radius: 20px;
        box-shadow: 0 22px 38px rgba(255, 96, 150, 0.17);
        overflow: hidden;
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px 8px;
        letter-spacing: 0.08em;
        font-weight: bold;
        font-size: 0.8rem;
        color: #5c3b42;
      }

      .scorebox {
        background: rgba(255,255,255,0.7);
        border-radius: 10px;
        min-width: 84px;
        padding: 8px 12px;
        text-align: center;
        box-shadow: inset 0 0 0 1px rgba(255, 120, 170, 0.15);
      }

      .scorebox small {
        display: block;
        opacity: 0.8;
        letter-spacing: 0.12em;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        background: linear-gradient(#fffdfd, #fff1f5);
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(255,255,255,0.15);
        text-align: center;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }

      .overlay.hidden { opacity: 0; }

      .overlay-box {
        background: rgba(255,255,255,0.5);
        padding: 22px 28px;
        border-radius: 16px;
        box-shadow: 0 10px 22px rgba(212, 82, 126, 0.1);
        max-width: 420px;
      }

      .overlay h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 3vw, 3rem);
        color: #7c2953;
      }

      .overlay p {
        margin: 0;
        font-size: 1rem;
        opacity: 0.8;
        color: #6a4a57;
      }

      .toast {
        position: absolute;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%) translateY(12px);
        background: linear-gradient(135deg, #ff7bac, #ffb2cd);
        color: white;
        padding: 12px 18px;
        border-radius: 999px;
        font-weight: 700;
        box-shadow: 0 10px 18px rgba(255, 95, 149, 0.25);
        opacity: 0;
        transition: all 0.25s ease;
        pointer-events: none;
        max-width: 80%;
        text-align: center;
      }

      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="game-wrap" id="gameWrap">
      <div class="hud">
        <div>BABE RUNNER</div>
        <div class="scorebox">
          <small>SCORE</small>
          <span id="score">0</span>
        </div>
        <div class="scorebox">
          <small>BEST</small>
          <span id="bestScore">0</span>
        </div>
      </div>

      <div style="position: relative;">
        <canvas id="gameCanvas" width="900" height="260" aria-label="Dino game"></canvas>
        <div id="toast" class="toast">wahhh boni 😍</div>
        <div class="overlay" id="overlay">
          <div class="overlay-box">
            <h1 id="overlayTitle">Press Space</h1>
            <p id="overlayText">Jump over the obstacles and win cute rewards.</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestScoreEl = document.getElementById('bestScore');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayText = document.getElementById('overlayText');
      const toast = document.getElementById('toast');

      const rewardList = [
        { threshold: 500, reward: 'Lip balm', text: 'wahhh boni 😍' },
        { threshold: 1000, reward: 'Heels', text: 'madam ji bach k ji 💃' },
        { threshold: 1500, reward: 'Gift', text: 'baby lg na jaye ji 💖' },
        { threshold: 2000, reward: 'Extra love', text: 'wahhh boni ❤️' }
      ];

      const game = {
        state: 'ready',
        groundY: 200,
        gravity: 0.72,
        speed: 6,
        score: 0,
        bestScore: Number(localStorage.getItem('dinoBestScore') || 0),
        spawnTimer: 0,
        lastTime: 0,
        rewardIndex: 0,
      };

      const dino = {
        x: 70,
        y: 156,
        width: 42,
        height: 44,
        vy: 0,
        jumpForce: 12.5,
        grounded: true,
        legPhase: 0,
      };

      const obstacles = [];
      let toastTimer = null;

      function resetDino() {
        dino.y = game.groundY - dino.height;
        dino.vy = 0;
        dino.grounded = true;
        dino.legPhase = 0;
      }

      function updateHud() {
        scoreEl.textContent = String(Math.floor(game.score));
        bestScoreEl.textContent = String(game.bestScore);
      }

      function showOverlay(title, text, visible = true) {
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        overlay.classList.toggle('hidden', !visible);
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
      }

      function checkRewards() {
        while (game.rewardIndex < rewardList.length && Math.floor(game.score) >= rewardList[game.rewardIndex].threshold) {
          const reward = rewardList[game.rewardIndex];
          showToast(`${reward.text} • ${reward.reward} unlocked`);
          game.rewardIndex += 1;
        }
      }

      function startGame() {
        if (game.state === 'running') return;

        if (game.state === 'gameover') {
          obstacles.length = 0;
          game.score = 0;
          game.speed = 6;
          game.spawnTimer = 0;
          game.rewardIndex = 0;
          resetDino();
        }

        game.state = 'running';
        showOverlay('', '', false);
      }

      function jump() {
        if (game.state === 'ready') {
          startGame();
        }

        if (game.state !== 'running') return;

        if (dino.grounded) {
          dino.vy = -dino.jumpForce;
          dino.grounded = false;
        }
      }

      function endGame() {
        game.state = 'gameover';
        game.bestScore = Math.max(game.bestScore, Math.floor(game.score));
        localStorage.setItem('dinoBestScore', String(game.bestScore));
        updateHud();
        showOverlay('koi na ji firse try kro', 'Babe, one more jump and you are winning again 😘', true);
      }

      function randomBetween(min, max) {
        return Math.random() * (max - min) + min;
      }

      function spawnObstacle() {
        const isBird = Math.random() < 0.25;

        if (isBird) {
          obstacles.push({
            type: 'bird',
            x: canvas.width + 20,
            y: 120 + Math.random() * 30,
            width: 34,
            height: 26,
            wing: Math.random() * Math.PI * 2,
          });
        } else {
          const height = randomBetween(28, 54);
          obstacles.push({
            type: 'cactus',
            x: canvas.width + 20,
            y: game.groundY - height,
            width: randomBetween(16, 30),
            height,
          });
        }
      }

      function rectCollision(a, b) {
        return (
          a.x < b.x + b.width &&
          a.x + a.width > b.x &&
          a.y < b.y + b.height &&
          a.y + a.height > b.y
        );
      }

      function update(delta) {
        if (game.state !== 'running') return;

        game.score += delta * 0.02;
        game.speed += delta * 0.0008;
        game.spawnTimer += delta;
        checkRewards();

        if (game.spawnTimer > Math.max(900, 1700 - game.speed * 40)) {
          spawnObstacle();
          game.spawnTimer = 0;
        }

        dino.vy += game.gravity;
        dino.y += dino.vy;

        const floorTop = game.groundY - dino.height;
        if (dino.y >= floorTop) {
          dino.y = floorTop;
          dino.vy = 0;
          dino.grounded = true;
        }

        dino.legPhase += delta * 0.02;

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obstacle = obstacles[i];
          obstacle.x -= game.speed + delta * 0.012;

          if (obstacle.type === 'bird') {
            obstacle.y += Math.sin((performance.now() * 0.008) + obstacle.wing) * 0.25;
          }

          if (obstacle.x + obstacle.width < -10) {
            obstacles.splice(i, 1);
            continue;
          }

          const dinoRect = {
            x: dino.x + 8,
            y: dino.y + 6,
            width: dino.width - 12,
            height: dino.height - 6,
          };

          const obsRect = {
            x: obstacle.x,
            y: obstacle.y,
            width: obstacle.width,
            height: obstacle.height,
          };

          if (rectCollision(dinoRect, obsRect)) {
            endGame();
            return;
          }
        }

        updateHud();
      }

      function drawGround() {
        ctx.fillStyle = '#4d4859';
        ctx.fillRect(0, game.groundY, canvas.width, canvas.height - game.groundY);

        const offset = (game.score * 4) % 28;
        ctx.strokeStyle = '#7a7288';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, game.groundY);
        ctx.lineTo(canvas.width, game.groundY);
        ctx.stroke();

        for (let x = -30; x < canvas.width + 30; x += 28) {
          ctx.fillStyle = '#fffefb';
          ctx.fillRect(x - offset, game.groundY + 12, 18, 6);
          ctx.fillRect(x - offset + 12, game.groundY + 4, 8, 6);
        }
      }

      function drawDino() {
        const legSwing = Math.sin(dino.legPhase) * 6;

        ctx.fillStyle = '#1d1d1d';
        ctx.fillRect(dino.x + 8, dino.y + 12, dino.width - 12, dino.height - 12);
        ctx.fillRect(dino.x + 12, dino.y, dino.width * 0.42, 14);
        ctx.fillRect(dino.x + dino.width * 0.68, dino.y + 6, 12, 12);

        ctx.fillStyle = '#f2d7e4';
        ctx.fillRect(dino.x + 10, dino.y + 14, dino.width - 16, 8);

        ctx.fillStyle = '#1d1d1d';
        ctx.fillRect(dino.x + dino.width - 12, dino.y + 18, 6, 6);

        ctx.fillRect(dino.x + 12, dino.y + dino.height - 2, 10, 8 + legSwing);
        ctx.fillRect(dino.x + dino.width - 20, dino.y + dino.height - 2, 10, 8 - legSwing);
      }

      function drawCactus(ob) {
        ctx.fillStyle = '#3fbf7f';
        ctx.fillRect(ob.x, ob.y, ob.width, ob.height);
        ctx.fillRect(ob.x + ob.width * 0.25, ob.y - 16, ob.width * 0.5, 16);

        ctx.fillStyle = '#2a9a68';
        ctx.fillRect(ob.x + 5, ob.y + 12, 5, ob.height - 12);
        ctx.fillRect(ob.x + ob.width - 10, ob.y + 12, 5, ob.height - 12);
      }

      function drawBird(ob) {
        const flap = Math.sin((performance.now() * 0.02) + ob.wing) * 8;

        ctx.fillStyle = '#ff9f43';
        ctx.beginPath();
        ctx.moveTo(ob.x, ob.y + ob.height / 2);
        ctx.quadraticCurveTo(ob.x + ob.width * 0.45, ob.y - flap, ob.x + ob.width, ob.y + ob.height / 2);
        ctx.quadraticCurveTo(ob.x + ob.width * 0.55, ob.y + ob.height, ob.x, ob.y + ob.height / 2);
        ctx.fill();

        ctx.fillStyle = '#111827';
        ctx.fillRect(ob.x + ob.width * 0.78, ob.y + ob.height * 0.35, 4, 4);
      }

      function drawObstacles() {
        for (const ob of obstacles) {
          if (ob.type === 'cactus') drawCactus(ob);
          else drawBird(ob);
        }
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fffdfd';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawGround();
        drawObstacles();
        drawDino();
      }

      function frame(timestamp) {
        const delta = Math.min(32, timestamp - (game.lastTime || timestamp));
        game.lastTime = timestamp;

        update(delta);
        render();
        requestAnimationFrame(frame);
      }

      document.addEventListener('keydown', (event) => {
        if (event.code === 'Space' || event.code === 'ArrowUp' || event.code === 'KeyW') {
          event.preventDefault();

          if (game.state === 'ready' || game.state === 'gameover') {
            game.score = 0;
            obstacles.length = 0;
            game.spawnTimer = 0;
            game.rewardIndex = 0;
            resetDino();
            startGame();
          }

          jump();
        }
      });

      canvas.addEventListener('pointerdown', () => {
        if (game.state === 'ready' || game.state === 'gameover') {
          game.score = 0;
          obstacles.length = 0;
          game.spawnTimer = 0;
          game.rewardIndex = 0;
          resetDino();
          startGame();
        }
        jump();
      });

      resetDino();
      updateHud();
      showOverlay('Press Space', 'Jump over the obstacles and unlock cute rewards.', true);
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
